<!DOCTYPE html>
<html>
<head>
    <title>Portfolio</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

   <h1>{{users_name}}</h1>
   <h2>{{users_bio}}</h2>

    <h1>Projects</h1>

    <ul>
        {% for project in projects %}
            <li>
                <h3>{{ project.title }}</h3>
                <p>{{ project.description }}</p>
                <a href="{{ project.link }}" target="_blank">
                    View on GitHub
                </a>
            </li>
        {% endfor %}
        <a href="/"><button>Return to main page</button></a>

    </ul>
</body>
</html>
