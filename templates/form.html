
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1 class="form-title">Создай своё портфолио</h1>
    <form action="/new_portfolio" method="POST" enctype="multipart/form-data">
        <h2>Name</h2>
        <input type="text" name="name" >
        <h2>Bio</h2>
        <textarea name = "bio" ></textarea>
        <h2>GIT Hub Username</h2>
        <input type="text" name="git" >
        <h2>Avatar</h2>
        <input type="file" name="image" accept="image/*">
        <button type="submit">Создать</button>
    </form>

</body>
</html>
